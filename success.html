<meta charset="utf-8">

<title>결제 완료 — 한국 가상컴</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{color-scheme:only light;--kvc-origin:"b824dc651e2702a9";--blue:#0B2FE8;--red:#E2233C;--gr:#0FA45E;--gold:#FFB808;
 --ink:#0B0E14;--ink2:#39404A;--ink3:#6B7381;--ink4:#9AA2AE;
 --line:#E3E6EC;--line2:#F0F2F5;--bg2:#F6F8FB}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{font-family:Pretendard,'Pretendard Variable',-apple-system,'Malgun Gothic',sans-serif;
 background:var(--bg2);color:var(--ink);font-size:15.5px;line-height:1.65;letter-spacing:-.022em;
 min-height:100vh;display:grid;place-items:center;padding:24px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.card{width:min(480px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;
 overflow:hidden;box-shadow:0 24px 60px rgba(11,14,20,.1)}
.hd{padding:30px 28px 24px;text-align:center;border-bottom:1px solid var(--line2)}
.hd .ic{width:72px;height:72px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;
 font-size:32px;background:#E9FBF1}
.hd .ic.wait{background:#FFF6E5}
.hd .ic.err{background:#FDEEF0}
.hd h1{font-size:22px;font-weight:800;letter-spacing:-.045em}
.hd p{margin-top:8px;font-size:14px;color:var(--ink3)}
.bd{padding:22px 28px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:14.5px;
 border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.row span{color:var(--ink3);font-size:13.5px}
.row b{font-weight:700;letter-spacing:.01em}
.row .cp{border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:12px;
 font-weight:700;color:var(--ink3);margin-left:8px}
.row .cp:hover{border-color:var(--blue);color:var(--blue)}
.note{margin:16px 28px 0;background:var(--bg2);border-radius:10px;padding:13px 16px;
 font-size:12.5px;color:var(--ink3);line-height:1.7}
.note b{color:var(--ink)}
.warn{margin:16px 28px 0;background:#FDEEF0;border:1px solid #F7CDD3;border-radius:10px;
 padding:13px 16px;font-size:12.5px;color:#8E1424;line-height:1.7}
.acts{display:flex;gap:8px;padding:20px 28px 26px}
.btn{flex:1;height:50px;border-radius:9px;font-weight:700;font-size:15px;display:grid;
 place-items:center;transition:.14s}
.btn-r{background:var(--red);color:#fff}.btn-r:hover{background:#C41B32}
.btn-o{border:1px solid var(--line);background:#fff}.btn-o:hover{border-color:var(--blue);color:var(--blue)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--blue);
 border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mask{letter-spacing:.15em;color:var(--ink4)}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="hd"><div class="spin"></div><h1>결제를 확인하고 있습니다…</h1>
    <p>잠시만 기다려 주세요. 창을 닫지 마세요.</p></div>
</div>
<script>
const $=s=>document.querySelector(s);
const w=n=>Number(n).toLocaleString('ko-KR');
const q=new URLSearchParams(location.search);
let last={}; try{last=JSON.parse(sessionStorage.getItem('kvc-last-order')||'{}')}catch(e){}

function render(html){$('#card').innerHTML=html}
function fail(title,msg){render(`
  <div class="hd"><div class="ic err">✕</div><h1>${title}</h1><p>${msg||''}</p></div>
  <div class="acts"><a class="btn btn-o" href="product.html">상품으로 돌아가기</a>
    <a class="btn btn-r" href="https://pf.kakao.com/_GxcgFxj/chat" target="_blank" rel="noopener">카톡 상담</a></div>`)}

/* 카드·간편결제 완료 → 배정된 PC 정보 표시
   a.assigned 가 있으면 서버가 실제로 배정한 PC 입니다.
   비밀번호는 이 화면에 내려보내지 않습니다 — 내 가상컴에서만 확인합니다. */
/* 애니데스크 번호 표기 — 실제 애니데스크는 **뒤에서부터** 세 자리씩 끊습니다.
   앞에서부터 끊으면 10자리 번호가 어긋나 고객이 대조할 때 헷갈립니다.
     1042887613 → 104 288 761 3   (틀림)
                → 1 042 887 613   (실제 애니데스크 표기) */
const adFmt=s=>{
  const d=String(s||'').replace(/[^0-9]/g,'');
  if(!d) return '';
  const out=[];
  for(let i=d.length;i>0;i-=3) out.unshift(d.slice(Math.max(0,i-3),i));
  return out.join(' ');
};
/* ★ 2026-11-07 결제 점검 — 예시 품번·예시 접속번호·"시안 결제" 문구를 뺐습니다.
     배정된 PC 가 없을 때도 실제 고객에게 예시 번호가 보였습니다.
     이제 PC 가 붙었으면 그 정보를, 아직이면 "배정 대기" 안내를 보여줍니다. */
const CONTACT=`<b>카카오톡 상담</b> 또는 <b>전화 <a href="tel:01084468710" style="text-decoration:underline">010-8446-8710</a></b>`;
/* ★ 연장 결제 성공 (2026-11-08) — 새 PC 가 아니라 "같은 PC · 새 만료일" 을 보여줍니다.
   서버가 extended:true · pn(쓰시던 품번) · endsAt(새로 늘어난 만료일) 을 줍니다. */
const fmtDay=s=>{const x=new Date(s); if(isNaN(x))return '—';
  return x.getFullYear()+'.'+String(x.getMonth()+1).padStart(2,'0')+'.'+String(x.getDate()).padStart(2,'0')};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
function extDone(d){
  render(`
  <div class="hd"><div class="ic">✓</div><h1>연장이 완료되었습니다</h1>
    <p>쓰시던 PC 를 <b>그대로</b> 이어서 쓰시면 됩니다.<br>접속 주소 · 비밀번호 · 자료 모두 바뀌지 않습니다.</p></div>
  <div class="bd">
    <div class="row"><span>문의번호</span><b>${esc(d.pn||'—')} <i style="font-style:normal;color:var(--ink4);font-size:12px">(같은 PC)</i></b></div>
    <div class="row"><span>새 만료일</span><b class="num" id="ext-end">${fmtDay(d.endsAt)}</b></div>
    <div class="row"><span>연장 기간</span><b>${esc(last.days||30)}일</b></div>
    <div class="row"><span>결제 금액</span><b class="num">${w(d.totalAmount||last.amt||0)}원 <i style="font-style:normal;color:var(--ink4);font-size:12px">(${esc(d.method||'결제')})</i></b></div>
    <div class="row"><span>주문번호</span><b class="num" style="font-size:13px">${esc(d.orderId||orderId||'—')}</b></div>
  </div>
  <div class="acts"><a class="btn btn-o" href="index.html">홈으로</a>
    <a class="btn btn-r" href="mypage.html">내 가상컴 보기</a></div>`);
}
/* 연장 결제는 됐는데 기간을 못 늘린 경우 — 자동 환불하지 않고 담당자가 연락드립니다 */
function extWait(d){
  render(`
  <div class="hd"><div class="ic">✓</div><h1>결제가 완료되었습니다</h1>
    <p><b>결제 완료 — 담당자가 곧 연락드립니다.</b><br>연장 처리를 담당자가 직접 확인해 드립니다.</p></div>
  <div class="bd">
    <div class="row"><span>결제 금액</span><b class="num">${w(d.totalAmount||last.amt||0)}원</b></div>
    <div class="row"><span>주문번호</span><b class="num" style="font-size:13px">${esc(d.orderId||orderId||'—')}</b></div>
  </div>
  <div class="note">급하시면 ${CONTACT} 으로 주문번호를 알려 주세요.</div>
  <div class="acts"><a class="btn btn-o" href="https://pf.kakao.com/_GxcgFxj/chat" target="_blank" rel="noopener">카톡 상담</a>
    <a class="btn btn-r" href="mypage.html">내 가상컴 보기</a></div>`);
}
function done(d){
  if(d.extended) return extDone(d);
  if(d.extendFailed) return extWait(d);
  const a=d.assigned;
  const prod=`
    <div class="row"><span>상품</span><b>${last.name||'가상컴'} · ${last.days||30}일</b></div>
    <div class="row"><span>결제 금액</span><b class="num">${w(d.totalAmount||last.amt||0)}원 <i style="font-style:normal;color:var(--ink4);font-size:12px">(${d.method||'결제'})</i></b></div>
    <div class="row"><span>주문번호</span><b class="num" style="font-size:13px">${d.orderId||orderId||'—'}</b></div>`;
  if(a){
    render(`
    <div class="hd"><div class="ic">✓</div><h1>개통이 완료되었습니다</h1>
      <p>아래 정보로 지금 바로 접속하실 수 있습니다.<br>이 정보는 <b>내 가상컴</b>에서 언제든 다시 보실 수 있습니다.</p></div>
    <div class="bd">
      <div class="row"><span>문의번호</span><b>${a.pn}</b></div>
      <div class="row"><span>접속 주소</span><b class="num">${adFmt(a.anydesk)||'내 가상컴에서 확인'}
        ${a.anydesk?`<button class="cp" data-c="${a.anydesk}">복사</button>`:''}</b></div>
      <div class="row"><span>비밀번호</span><b style="font-size:14px;color:var(--ink3)">
        내 가상컴에서 확인</b></div>
      ${prod}
    </div>
    <div class="acts"><a class="btn btn-o" href="index.html">홈으로</a>
      <a class="btn btn-r" href="mypage.html">내 가상컴 보기</a></div>`);
    return;
  }
  /* 결제는 됐지만 아직 PC 가 붙지 않은 경우 (그 사양이 방금 다 나갔거나 배정 오류) */
  render(`
  <div class="hd"><div class="ic">✓</div><h1>결제가 완료되었습니다</h1>
    <p>지금 <b>PC 배정을 준비</b>하고 있습니다.<br>배정되면 <b>내 가상컴</b>에서 접속 정보를 보실 수 있습니다.</p></div>
  <div class="bd">${prod}</div>
  <div class="note"><b>배정 대기 중입니다.</b> 담당자가 확인하는 대로 바로 배정해 드립니다.
    급하시면 ${CONTACT} 으로 주문번호를 알려 주세요.</div>
  <div class="acts"><a class="btn btn-o" href="https://pf.kakao.com/_GxcgFxj/chat" target="_blank" rel="noopener">카톡 상담</a>
    <a class="btn btn-r" href="mypage.html">내 가상컴 보기</a></div>`);
}

/* 가상계좌 발급 → 입금 대기 */
function va(d){
  const v=d.virtualAccount||{};
  render(`
  <div class="hd"><div class="ic wait">🏦</div><h1>입금 계좌가 발급되었습니다</h1>
    <p>아래 계좌로 입금하시면 <b>자동으로 확인되어 바로 개통</b>됩니다.<br>담당자를 기다리실 필요가 없습니다.</p></div>
  <div class="bd">
    <div class="row"><span>입금 은행</span><b>${v.bankCode?bank(v.bankCode):'—'}</b></div>
    <div class="row"><span>계좌번호</span><b class="num">${v.accountNumber||'—'}
      ${v.accountNumber?`<button class="cp" data-c="${v.accountNumber}">복사</button>`:''}</b></div>
    <div class="row"><span>입금 금액</span><b class="num">${w(d.totalAmount||0)}원</b></div>
    <div class="row"><span>입금 기한</span><b>${v.dueDate? v.dueDate.replace('T',' ').slice(0,16):'24시간 이내'}</b></div>
    ${/* customerName 은 계좌 주인이 아니라 "입금하실 분" 이름입니다 */''}
    ${v.customerName?`<div class="row"><span>입금자명</span><b>${v.customerName}</b></div>`:''}
  </div>
  <!-- ★ 문자·알림톡 발송을 붙이면 이 세 곳의 문구를 되돌립니다 (success.html 안에서 "문자" 로 검색)
          지금은 발송 기능이 없어서 "문자로 보내드렸습니다" 는 지키지 못하는 약속입니다. -->
  <div class="note"><b>입금이 확인되면 자동으로 개통</b>됩니다. 접속 주소와 비밀번호는 <b>내 가상컴</b>에서 확인하실 수 있습니다.
    입금 금액이 다르면 확인되지 않으니 <b>위 금액 그대로</b> 보내 주세요.
    문의는 ${CONTACT} 으로 해 주세요.</div>
  <div class="acts"><a class="btn btn-o" href="index.html">홈으로</a>
    <a class="btn btn-r" href="https://pf.kakao.com/_GxcgFxj/chat" target="_blank" rel="noopener">카톡 상담</a></div>`)}
function bank(c){return ({'20':'우리은행','88':'신한은행','04':'국민은행','11':'농협','81':'하나은행','03':'기업은행','90':'카카오뱅크','92':'토스뱅크'})[c]||('은행코드 '+c)}

document.addEventListener('click',e=>{
  const c=e.target.closest('[data-c]');
  if(c&&navigator.clipboard){navigator.clipboard.writeText(c.dataset.c);
    c.textContent='✓';setTimeout(()=>c.textContent='복사',1200)}
});

const paymentKey=q.get('paymentKey'), orderId=q.get('orderId'), amount=q.get('amount');
/* 목록에서 고른 PC — 결제 페이지가 성공 주소에 실어 보낸 것입니다.
   서버가 이 PC 를 먼저 배정해 봅니다. 이미 팔렸으면 같은 상품의
   다른 PC 로 배정되므로 값이 이상해도 위험하지 않습니다. */
const wantPn=(q.get('pc')||'').toUpperCase();
if(!paymentKey||!orderId||!amount){ fail('잘못된 접근입니다','결제 정보가 없습니다.'); }
else{
  fetch('/api/toss-confirm',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({paymentKey,orderId,amount,wantPn})})
  .then(r=>r.json())
  .then(d=>{
    if(d.status==='DONE') done(d);
    else if(d.status==='WAITING_FOR_DEPOSIT') va(d);
    else fail('결제 확인에 실패했습니다', d.message||d.error||('상태: '+(d.status||'알 수 없음')));
  })
  .catch(()=>fail('서버 연결에 실패했습니다','잠시 후 다시 시도해 주세요.'));
}
</script>
