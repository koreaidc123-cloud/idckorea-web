<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>결제 실패 — 한국 가상컴</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--kvc-origin:"b78e692fb1b509d7";--blue:#0B2FE8;--red:#E2233C;--ink:#0B0E14;--ink3:#6B7381;--line:#E3E6EC;--bg2:#F6F8FB}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Pretendard,-apple-system,'Malgun Gothic',sans-serif;background:var(--bg2);
 color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;
 letter-spacing:-.022em;line-height:1.65}
a{color:inherit;text-decoration:none}
.card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;
 padding:34px 30px;text-align:center;box-shadow:0 24px 60px rgba(11,14,20,.1)}
.ic{width:72px;height:72px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;
 font-size:30px;background:#FDEEF0}
h1{font-size:21px;font-weight:800;letter-spacing:-.045em}
p{margin-top:10px;font-size:14px;color:var(--ink3)}
.code{margin-top:14px;background:var(--bg2);border-radius:9px;padding:10px 14px;font-size:12.5px;
 color:var(--ink3);word-break:break-all}
.acts{display:flex;gap:8px;margin-top:24px}
.btn{flex:1;height:50px;border-radius:9px;font-weight:700;font-size:15px;display:grid;place-items:center}
.btn-r{background:var(--red);color:#fff}
.btn-o{border:1px solid var(--line);background:#fff}
</style>
</head>
<body>
<div class="card">
  <div class="ic">✕</div>
  <h1>결제가 완료되지 않았습니다</h1>
  <p id="msg">결제 과정이 중단되었습니다. 다시 시도해 주세요.</p>
  <div class="code" id="code" hidden></div>
  <div class="acts">
    <a class="btn btn-o" href="product.html">다시 시도</a>
    <a class="btn btn-r" href="https://pf.kakao.com/_GxcgFxj/chat" target="_blank" rel="noopener">카톡 상담</a>
  </div>
</div>
<script>
const q=new URLSearchParams(location.search);
const m=q.get('message'), c=q.get('code');
if(m)document.getElementById('msg').textContent=m;
if(c){const el=document.getElementById('code');el.hidden=false;el.textContent='오류 코드: '+c}
</script>
</body>
</html>
