<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="darkreader-lock">

<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>관리자 — 한국 가상컴</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* ═══════════════════════════════════════════════════════════════
   한국 가상컴 관리자 (시안 · 목업 데이터)
   확정 설계 반영:
   · 식별 3층 — 위치(영태리 5-4-1) / 품번(Y-042) / 애니데스크 번호·비번
   · 자리 번호는 오른쪽 끝이 1번, 1층이 화면 맨 아래
   · 미등록 → 품번 부여 → 미검증 → 접속 확인 → 판매 가능
   · 애니 비번은 기본 마스킹, 열람 시 기록
   · 임대중 다운 = 최우선 경고 (깜빡임은 이 경우에만)
   · 설정값(셋팅비·판정시간·할인율)은 하드코딩 금지 → 설정 화면
   ═══════════════════════════════════════════════════════════════ */
:root{color-scheme:only light;
  --blue:#0B2FE8;--blue-l:#EEF1FE;--red:#E2233C;--red-l:#FDEEF0;
  --gr:#0FA45E;--gr-l:#E9FBF1;--org:#E08B00;--org-l:#FFF6E5;
  --vio:#7A2BE0;--vio-l:#F3EBFE;--gold:#FFB808;
  --ink:#0B0E14;--ink2:#39404A;--ink3:#6B7381;--ink4:#9AA2AE;
  --line:#E3E6EC;--line2:#F0F2F5;--bg:#F6F8FB;
  --side:#0B0E14;--sh:0 1px 2px rgba(11,14,20,.05),0 10px 30px rgba(11,14,20,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{font-family:Pretendard,'Pretendard Variable',-apple-system,'Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.6;letter-spacing:-.02em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;letter-spacing:inherit}
input,select{font:inherit;letter-spacing:inherit}
.num{font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}

/* ── 로그인 게이트 ── */
.gate{position:fixed;inset:0;z-index:300;background:#0B0E14;display:grid;place-items:center;color:#fff}
.gate.off{display:none}
.gate-box{width:min(360px,92vw);text-align:center}
.gate-box .lg{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:26px;
  font-size:20px;font-weight:800;letter-spacing:-.06em}
.gate-box p{font-size:13.5px;color:#8A94A6;margin-bottom:18px}
.gate-box input{width:100%;height:54px;border-radius:10px;border:1px solid #2A3140;background:#141926;
  color:#fff;text-align:center;font-size:22px;letter-spacing:.4em;font-weight:800}
.gate-box input:focus{outline:0;border-color:var(--blue)}
.gate-box button{width:100%;height:50px;border-radius:10px;background:var(--red);color:#fff;
  font-weight:800;font-size:15px;margin-top:12px}
.gate-box .err{color:#FF8A96;font-size:13px;margin-top:10px;min-height:20px}

/* ── 레이아웃 ── */
.side{position:fixed;left:0;top:0;bottom:0;width:224px;background:var(--side);color:#fff;
  display:flex;flex-direction:column;z-index:50}
.side .lg{display:flex;align-items:center;gap:9px;padding:20px 18px 16px;font-size:16.5px;
  font-weight:800;letter-spacing:-.05em;border-bottom:1px solid rgba(255,255,255,.08)}
.side .lg span{font-size:10px;color:#6B7381;font-weight:700;background:rgba(255,255,255,.08);
  padding:2px 7px;border-radius:99px;margin-left:auto}
.nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
  font-size:14px;font-weight:600;color:#9AA2AE;margin-bottom:2px;transition:.13s}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:var(--red);color:#fff;font-weight:700}
.nav a i{font-style:normal;width:20px;text-align:center;flex:none}
.nav a .bd{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;
  background:rgba(255,255,255,.14);font-size:11px;font-weight:800;display:grid;place-items:center}
.nav a .bd.hot{background:var(--red)}
.nav a.on .bd.hot{background:rgba(255,255,255,.25)}
.nav .sep{margin:12px 12px 8px;font-size:10.5px;font-weight:800;color:#4A5260;letter-spacing:.06em}
.side .ft{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#6B7381}
.side .ft b{color:#9AA2AE}

.main{margin-left:224px;padding:22px 26px 60px;min-height:100vh}
.top{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.top h1{font-size:21px;font-weight:800;letter-spacing:-.045em}
.top .live{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink3);
  background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 13px}
.top .live .dt{width:7px;height:7px;border-radius:50%;background:var(--gr)}
.top .sp{margin-left:auto;display:flex;gap:8px}

/* ── 공통 부품 ── */
.card{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh)}
.grid{display:grid;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;
  padding:0 15px;border-radius:8px;font-weight:700;font-size:13.5px;transition:.13s;white-space:nowrap}
.btn-r{background:var(--red);color:#fff}.btn-r:hover{background:#C41B32}
.btn-b{background:var(--blue);color:#fff}.btn-b:hover{background:#0722B4}
.btn-g{background:var(--gr);color:#fff}.btn-g:hover{background:#0B7E48}
.btn-o{border:1px solid var(--line);background:#fff;color:var(--ink2)}
.btn-o:hover{border-color:var(--blue);color:var(--blue)}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;
  font-size:11.5px;font-weight:800;letter-spacing:-.02em}
.tag i{font-style:normal;width:6px;height:6px;border-radius:50%;background:currentColor}
.t-rent{background:var(--blue-l);color:var(--blue)}
.t-ok{background:var(--gr-l);color:var(--gr)}
.t-fix{background:var(--org-l);color:var(--org)}
.t-new{background:var(--vio-l);color:var(--vio)}
.t-down{background:var(--red-l);color:var(--red)}
.t-down i{animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
.t-unv{background:#EDEFF3;color:var(--ink3)}
.warnbadge{display:inline-flex;align-items:center;gap:5px;background:var(--red-l);color:var(--red);
  font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px}

/* 표 */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{background:var(--bg);text-align:left;padding:9px 12px;font-size:12px;font-weight:800;
  color:var(--ink3);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:.1s}
.tbl tbody tr:hover{background:#FAFBFE}
.tbl .pn{font-weight:800;letter-spacing:-.02em}
.tbl .dim{color:var(--ink4);font-size:12.5px}
.mask{font-family:inherit;letter-spacing:.14em;color:var(--ink4)}
.pager2{display:flex;gap:4px;justify-content:center;padding:14px}
.pager2 button{min-width:32px;height:32px;border:1px solid var(--line);border-radius:7px;
  background:#fff;font-size:13px;font-weight:700;color:var(--ink2)}
.pager2 button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pager2 button:disabled{opacity:.35}

/* KPI */
.kpis{grid-template-columns:repeat(6,1fr)}
.kpi{padding:16px 18px}
.kpi .l{font-size:12px;font-weight:700;color:var(--ink3)}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.05em;margin-top:3px}
.kpi.crit{border-color:#F7CDD3;background:#FFF8F9}
.kpi.crit b{color:var(--red)}
.kpi .sub{font-size:11.5px;color:var(--ink4);margin-top:2px}

/* 섹션 헤더 */
.sec-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.sec-h h3{font-size:15px;font-weight:800;letter-spacing:-.035em}
.sec-h .cnt{font-size:12px;font-weight:800;color:var(--ink3);background:var(--bg);
  padding:2px 9px;border-radius:99px}
.sec-h .r{margin-left:auto;display:flex;gap:7px;align-items:center}
.sec-b{padding:0}
.sec-b.pad{padding:16px 18px}

/* 필터 바 */
.fbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line2);
  align-items:center}
.fbar select,.fbar input{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 11px;
  font-size:13.5px;background:#fff}
.fbar input:focus,.fbar select:focus{outline:0;border-color:var(--blue)}
.fbar .grow{flex:1;min-width:160px}

/* 랙맵 */
.rooms3{grid-template-columns:repeat(3,1fr)}
.roomcard{padding:16px 18px;cursor:pointer;transition:.14s;border:1px solid var(--line)}
.roomcard:hover{border-color:var(--blue)}
.roomcard.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.roomcard b{font-size:16px;font-weight:800}
.roomcard .sub{font-size:12px;color:var(--ink4)}
.roomcard .bar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:10px;background:var(--line2)}
.roomcard .bar i{display:block;height:100%}
.rackrow{display:flex;gap:8px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line2)}
.rackbtn{border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-size:13px;
  font-weight:800;background:#fff;transition:.12s;position:relative}
.rackbtn:hover{border-color:var(--blue);color:var(--blue)}
.rackbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.rackbtn .d{position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;
  background:var(--red);animation:bl 1s infinite}
.rackmap{padding:20px 18px}
.floor{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.floor .fl{width:36px;font-size:12px;font-weight:800;color:var(--ink3);text-align:right;flex:none}
.slots{display:flex;gap:5px;flex:1}
.slot{flex:1;aspect-ratio:1;max-width:44px;border-radius:7px;display:grid;place-items:center;
  font-size:10px;font-weight:800;cursor:pointer;transition:.1s;border:1px solid transparent;
  color:rgba(255,255,255,.85)}
.slot:hover{transform:scale(1.12);z-index:2}
.s-rent{background:#3B62E8}
.s-ok{background:#12B76A}
.s-fix{background:#E08B00}
.s-new{background:#8A4DE8}
.s-unv{background:#8A94A6}
.s-down{background:var(--red);animation:bl 1s infinite}
.s-empty{background:#fff;border-color:var(--line);color:var(--ink4);cursor:default}
.s-empty:hover{transform:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line2);
  font-size:12px;color:var(--ink3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{font-style:normal;width:11px;height:11px;border-radius:4px;display:inline-block}
.dirnote{font-size:11.5px;color:var(--ink4);padding:0 18px 12px;text-align:right}
.floor .flcnt{width:44px;font-size:11px;color:var(--ink4);text-align:left;flex:none}
/* 랙 구조 편집 패널 */
.editpanel{border-bottom:1px solid var(--line2);background:#FBFCFE;padding:14px 18px}
.ep-h{margin-bottom:10px}
.ep-h b{font-size:14px;font-weight:800}
.ep-h span{display:block;font-size:12px;color:var(--ink4)}
.ep-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px}
.ep-row b{width:34px;font-weight:800;color:var(--ink2)}
.ep-row input{width:74px;height:34px;border:1px solid var(--line);border-radius:8px;
  padding:0 10px;text-align:center;font-weight:800;background:#fff}
.ep-row input:focus{outline:0;border-color:var(--blue)}
.ep-row span{color:var(--ink4);font-size:12px}
.ep-dim{color:var(--ink4);font-size:12px}
.ep-acts{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}

/* 드로어 */
.drawer{position:fixed;top:0;right:-460px;bottom:0;width:440px;background:#fff;z-index:120;
  box-shadow:-16px 0 50px rgba(11,14,20,.18);transition:right .25s ease;display:flex;flex-direction:column}
.drawer.on{right:0}
.drawer .hd{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer .hd b{font-size:17px;font-weight:800}
.drawer .hd .x{margin-left:auto;width:32px;height:32px;border-radius:8px;font-size:16px;color:var(--ink3)}
.drawer .hd .x:hover{background:var(--bg)}
.drawer .bd{flex:1;overflow-y:auto;padding:18px 20px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:13.5px;margin-bottom:16px}
.kv .k{color:var(--ink3);font-size:12.5px;padding-top:2px}
.kv .v{font-weight:600}
.kv .v.big{font-size:16px;font-weight:800}
.pwrow{display:flex;align-items:center;gap:8px}
.pwrow .btn-sm{flex:none}
.blockttl{font-size:12px;font-weight:800;color:var(--ink3);margin:18px 0 8px;
  padding-top:14px;border-top:1px solid var(--line2)}
.viewlog{font-size:12px;color:var(--ink4);line-height:1.7}
.dracts{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(11,14,20,.35);z-index:110;opacity:0;
  pointer-events:none;transition:.2s}
.overlay.on{opacity:1;pointer-events:auto}

/* 주문 상세 접속정보 미리보기 */
.credbox{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-top:8px}
.credbox .ch{background:var(--ink);color:#fff;padding:10px 14px;font-size:12.5px;font-weight:800}
.credbox .cb{padding:12px 14px;display:grid;gap:7px;font-size:13.5px}
.credbox .cr{display:flex;justify-content:space-between;align-items:center}
.credbox .cr span{color:var(--ink3);font-size:12.5px}
.credbox .cr b{font-weight:700;letter-spacing:.02em}
.mismatch{background:var(--red-l);border:1px solid #F7CDD3;border-radius:10px;padding:11px 14px;
  font-size:13px;color:#8E1424;line-height:1.6;margin-top:8px}
.mismatch b{font-weight:800}

/* 알림 */
.noti-st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;
  padding:3px 9px;border-radius:99px}
.n-ok{background:var(--gr-l);color:var(--gr)}
.n-sms{background:var(--org-l);color:var(--org)}
.n-wait{background:#EDEFF3;color:var(--ink3)}

/* 설정 */
.setrow{display:grid;grid-template-columns:1fr 180px;gap:12px;align-items:center;
  padding:13px 18px;border-bottom:1px solid var(--line2)}
.setrow:last-child{border-bottom:0}
.setrow .sl b{display:block;font-size:14px;font-weight:700}
.setrow .sl span{font-size:12.5px;color:var(--ink4)}
.setrow input{height:38px;border:1px solid var(--line);border-radius:8px;padding:0 12px;
  text-align:right;font-weight:700}
.setrow input:focus{outline:0;border-color:var(--blue)}

/* 검색 */
.bigsearch{display:flex;gap:8px;margin-bottom:16px}
.bigsearch input{flex:1;height:50px;border:1px solid var(--line);border-radius:11px;padding:0 18px;
  font-size:15.5px;background:#fff}
.bigsearch input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,47,232,.1)}
.hitgrp{margin-bottom:14px}
.hitgrp .gt{font-size:12px;font-weight:800;color:var(--ink3);margin-bottom:7px}
.hit{display:flex;align-items:center;gap:12px;padding:11px 15px;background:#fff;
  border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;transition:.12s}
.hit:hover{border-color:var(--blue)}
.hit b{font-weight:800}
.hit .dim{color:var(--ink4);font-size:12.5px}
.hit .tag{margin-left:auto}

.empty2{padding:44px;text-align:center;color:var(--ink4);font-size:13.5px}
.empty2 b{display:block;font-size:15px;color:var(--ink2);margin-bottom:4px}

@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.rooms3{grid-template-columns:1fr}}
@media(max-width:820px){
  .side{width:64px}
  .side .lg{justify-content:center;padding:16px 8px}.side .lg b,.side .lg span{display:none}
  .nav a span,.nav a .bd,.nav .sep,.side .ft{display:none}
  .nav a{justify-content:center}
  .main{margin-left:64px;padding:16px 14px 50px}
  .drawer{width:100vw;right:-100vw}
}
</style>
</head>
<body>

<!-- ═══ 게이트 ═══ -->
<div class="gate" id="gate">
  <div class="gate-box">
    <div class="lg">
      <svg width="34" height="34" viewBox="0 0 100 100"><g transform="rotate(-28 50 50)">
        <path d="M50 4a46 46 0 0 0 0 92 23 23 0 0 1 0-46 23 23 0 0 0 0-46Z" fill="#E8412E"/>
        <path d="M50 4a46 46 0 0 1 0 92 23 23 0 0 0 0-46 23 23 0 0 1 0-46Z" fill="#1B4FD8"/>
      </g></svg>
      한국 가상컴 관리자
    </div>
    <p>관리자 코드를 입력해 주세요</p>
    <input type="password" id="gate-pw" maxlength="8" autocomplete="off">
    <button id="gate-go">들어가기</button>
    <div class="err" id="gate-err"></div>
  </div>
</div>

<!-- ═══ 사이드바 ═══ -->
<aside class="side">
  <div class="lg">
    <svg width="26" height="26" viewBox="0 0 100 100"><g transform="rotate(-28 50 50)">
      <path d="M50 4a46 46 0 0 0 0 92 23 23 0 0 1 0-46 23 23 0 0 0 0-46Z" fill="#E8412E"/>
      <path d="M50 4a46 46 0 0 1 0 92 23 23 0 0 0 0-46 23 23 0 0 1 0-46Z" fill="#1B4FD8"/>
    </g></svg>
    <b>한국 가상컴</b><span>ADMIN</span>
  </div>
  <nav class="nav" id="nav">
    <a href="#dash" data-v="dash"><i>📊</i><span>대시보드</span><em class="bd hot" id="bd-warn" hidden></em></a>
    <div class="sep">PC 등록</div>
    <a href="#newpc" data-v="newpc"><i>📦</i><span>미등록 PC</span><em class="bd" id="bd-new"></em></a>
    <a href="#verify" data-v="verify"><i>🔍</i><span>검증 대기</span><em class="bd" id="bd-unv"></em></a>
    <div class="sep">운영</div>
    <a href="#today" data-v="today"><i>✅</i><span>오늘 할 일</span><em class="bd hot" id="bd-today"></em></a>
    <a href="#rack" data-v="rack"><i>🗄️</i><span>랙맵</span></a>
    <a href="#pcs" data-v="pcs"><i>🖥️</i><span>PC 관리</span></a>
    <a href="#members" data-v="members"><i>👤</i><span>회원 관리</span></a>
    <a href="#orders" data-v="orders"><i>🧾</i><span>주문 · 고객</span></a>
    <a href="#noti" data-v="noti"><i>🔔</i><span>알림 발송</span><em class="bd" id="bd-noti"></em></a>
    <div class="sep">도구</div>
    <a href="#find" data-v="find"><i>🔎</i><span>통합검색</span></a>
    <a href="#set" data-v="set"><i>⚙️</i><span>설정</span></a>
  </nav>
  <div class="ft">시안 · 목업 데이터<br><b>실서비스 연동 전</b></div>
</aside>

<main class="main" id="main"></main>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer"></div>

<script>
/* ═══════════════ 목업 데이터 (시드 고정) ═══════════════ */
let seed=20260811;
const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff};
const pad=(n,w)=>String(n).padStart(w||3,'0');
const w=n=>n.toLocaleString('ko-KR');
const $=id=>document.getElementById(id);

const ROOMS=[
 {k:'K',name:'금촌', racks:7},
 {k:'Y',name:'영태리',racks:9},
 {k:'D',name:'등원리',racks:6},
];
const FLOORS=4, SLOTS=14;   // 자리 1번 = 오른쪽 끝, 1층 = 화면 맨 아래
const SPECS=[
 {id:1,n:'인텔I5 4690',      core:'4코어', ram:8, ssd:120,gpu:'GTX 750~750TI',        p:40000},
 {id:2,n:'라이젠 2200G~2400G',core:'4코어', ram:8, ssd:120,gpu:'VEGA 내장그래픽',      p:40000},
 {id:3,n:'라이젠 5600G~5700G',core:'6~8코어',ram:32,ssd:240,gpu:'내장 (추가 가능)',    p:55000},
 {id:4,n:'라이젠 1700',       core:'8코어', ram:32,ssd:480,gpu:'GTX 1050TI 4G~1060',  p:60000},
 {id:5,n:'라이젠 3700X',      core:'8코어', ram:32,ssd:480,gpu:'GTX 1050TI 4G~1060',  p:65000},
];
const ST={rent:'임대중',ok:'임대 가능',fix:'점검중',new:'미등록',unv:'미검증',down:'다운'};
const STC={rent:'t-rent',ok:'t-ok',fix:'t-fix',new:'t-new',unv:'t-unv',down:'t-down'};

/* PC 생성 — 방·랙·층·자리 물리 좌표 기준 */
const PCS=[]; const seq={K:0,Y:0,D:0};
for(const r of ROOMS){
  for(let rack=1;rack<=r.racks;rack++){
    for(let fl=1;fl<=FLOORS;fl++){
      for(let slot=1;slot<=SLOTS;slot++){
        if(rnd()<.08) continue;                       // 빈 자리
        const sp=SPECS[Math.floor(rnd()*rnd()*SPECS.length)];
        const st=rnd()<.70?'rent':'ok';
        PCS.push({
          room:r.k, roomName:r.name, rack, fl, slot,
          pn:r.k+'-'+pad(++seq[r.k]),
          spec:sp, st,
          ad:String(100000000+Math.floor(rnd()*899999999)),
          pw:'한국'+(1000+Math.floor(rnd()*9000)),
          ip:[59,121,175,211,220][Math.floor(rnd()*5)]+'.'+(10+Math.floor(rnd()*80))+'.*.**',
          beat: Math.floor(rnd()*9)+1,                // n초 전 신호
        });
      }
    }
  }
}
/* 상태 후처리 — 재현 가능한 위치에서 뽑는다 */
function pick(st,n,to,unsetPn){
  let c=0;
  for(let i=0;i<PCS.length&&c<n;i+=7){
    const x=PCS[(i*13+c*31)%PCS.length];
    if(x.st===st && !x.touched){ x.st=to; x.touched=1; if(unsetPn){x.pnOld=x.pn;x.pn=null;} c++; }
  }
}
pick('ok',22,'fix');
pick('ok',7,'unv');
pick('ok',5,'new',true);
pick('rent',3,'down');           // ★ 임대중 다운 = 최우선 경고
pick('ok',4,'down');

/* 고객·주문 생성 — 임대중 PC 에 배정 */
const SUR='김이박최정강조윤장임한오서신권황안송전홍'.split('');
const GN=['민준','서연','도윤','지우','예준','하은','시우','수아','주원','지호','준서','다은','건우','채원','현우','유진','우진','서현','민재','가은'];
const name=()=>SUR[Math.floor(rnd()*SUR.length)]+GN[Math.floor(rnd()*GN.length)];
const phone=()=>'010-'+(1000+Math.floor(rnd()*9000))+'-'+(1000+Math.floor(rnd()*9000));
const PMS=['가상계좌','신용카드','카카오페이','네이버페이','스마트스토어'];
const CARDS=['신한','국민','현대','삼성','롯데','우리'];
const TODAY=new Date(); TODAY.setHours(0,0,0,0);
const fmtD=d=>{const x=new Date(d);return (x.getMonth()+1)+'/'+x.getDate()};
const ORDERS=[];
let ono=2600;
for(const pc of PCS){
  if(pc.st!=='rent'&&pc.st!=='down')continue;
  if(pc.st==='rent'&&rnd()<.55)continue;              // 전부 다 만들면 무거우니 일부만
  const days=[30,30,30,60,90][Math.floor(rnd()*5)];
  const left=1+Math.floor(rnd()*days);
  const start=new Date(TODAY); start.setDate(start.getDate()-(days-left));
  const end=new Date(start); end.setDate(end.getDate()+days);
  const via=rnd()<.72?'kakao':'google';
  const nm=name();
  const mis=rnd()<.15;
  const pm=PMS[Math.floor(rnd()*PMS.length)];
  const off=days===60?3:days===90?5:0;
  const amt=Math.round(pc.spec.p*days/30*(100-off)/100);
  ORDERS.push({
    no:'2608-'+(ono++), pc, nm, ph:phone(), via,
    payer: mis&&rnd()<.5? name():nm,
    userNm: mis? name():nm, userPh: mis? phone():null, mis,
    pm, card: pm==='신용카드'? CARDS[Math.floor(rnd()*CARDS.length)]+' '+(1000+Math.floor(rnd()*9000)):null,
    depositor: pm==='가상계좌'? (mis&&rnd()<.5?name():nm):null,
    days, amt, start, end, left,
  });
  pc.order=ORDERS[ORDERS.length-1];
}
ORDERS.sort((a,b)=>a.left-b.left);

/* 설정 — 하드코딩 금지, 관리자에서 수정 (localStorage) */
const DEFSET={setup:5000, downSec:60, notiDay:5, off60:3, off90:5};
let SET=Object.assign({},DEFSET);
try{ SET=Object.assign({},DEFSET,JSON.parse(localStorage.getItem('kvc-set')||'{}')) }catch(e){}

/* 랙 구성 — 하드코딩 금지.
   랙마다 층수가 다를 수 있고, 층마다 자리 수도 다를 수 있다 (예: 7·7·7·5).
   배열 = 층별 자리 수, [0]번이 1층. 관리자에서 추가·수정하면 즉시 반영·보존된다. */
function defRacks(){const o={};for(const r of ROOMS){o[r.k]=Array.from({length:r.racks},()=>[SLOTS,SLOTS,SLOTS,SLOTS])}return o}
let RACKS=defRacks();
try{const s=JSON.parse(localStorage.getItem('kvc-racks')||'null');if(s&&s.K&&s.Y&&s.D)RACKS=s}catch(e){}
const saveRacks=()=>localStorage.setItem('kvc-racks',JSON.stringify(RACKS));

/* ═══ 랙 구조를 실제 PC 위치에서 만들어 냅니다 ═══
   전에는 랙 수·층수·자리수를 브라우저에 따로 저장했습니다. 그래서
     · 다른 PC 에서 관리자를 열면 구조가 달랐고
     · 현장에서 적어 온 자리가 그 구조를 벗어나면 랙맵에 안 보였습니다.
   이제는 등록된 PC 들이 실제로 꽂힌 자리를 보고 격자를 그립니다.
   구조를 따로 관리할 필요가 없고, 현장 입력과 절대 어긋나지 않습니다.
   (여유분으로 랙·층·자리를 하나씩 더 그려 빈자리가 보이게 합니다) */
function racksFromPCS(){
  const o={};
  for(const r of ROOMS){
    const mine=PCS.filter(p=>p.room===r.k && p.rack>0 && p.fl>0 && p.slot>0);
    const maxRack=mine.reduce((m,p)=>Math.max(m,p.rack),0);
    const racks=[];
    for(let rk=1; rk<=Math.max(maxRack+1,1); rk++){
      const inRack=mine.filter(p=>p.rack===rk);
      const maxFl=inRack.reduce((m,p)=>Math.max(m,p.fl),0);
      const fls=[];
      for(let fl=1; fl<=Math.max(maxFl+1,1); fl++){
        const maxSlot=inRack.filter(p=>p.fl===fl).reduce((m,p)=>Math.max(m,p.slot),0);
        fls.push(Math.max(maxSlot+1,1));
      }
      racks.push(fls);
    }
    o[r.k]=racks;
  }
  return o;
}
const rackOcc=(room,rack)=>PCS.filter(p=>p.room===room&&p.rack===rack);
const floorMaxSlot=(room,rack,fl)=>rackOcc(room,rack).filter(p=>p.fl===fl).reduce((m,p)=>Math.max(m,p.slot),0);

/* 열람 기록 */
let VLOG=[];
try{ VLOG=JSON.parse(localStorage.getItem('kvc-vlog')||'[]') }catch(e){}
function logView(pn,act){
  VLOG.unshift({pn, t:new Date().toLocaleString('ko-KR'), act:act||'열람'});
  VLOG=VLOG.slice(0,80);
  localStorage.setItem('kvc-vlog',JSON.stringify(VLOG));
}

/* ═══════════════ 공통 렌더 ═══════════════ */
const cnt=st=>PCS.filter(p=>p.st===st).length;
const stTag=p=>'<span class="tag '+STC[p.st]+'"><i></i>'+ST[p.st]+'</span>';
const locStr=p=>p.roomName+' '+p.rack+'-'+p.fl+'-'+p.slot;
function badges(){
  const dn=cnt('down');
  $('bd-new').textContent=cnt('new');
  $('bd-unv').textContent=cnt('unv');
  $('bd-noti').textContent=ORDERS.filter(o=>o.left<=SET.notiDay).length;
  if(dn>0){$('bd-warn').hidden=false;$('bd-warn').textContent=dn}else{$('bd-warn').hidden=true}
  const tc=todayCounts(); const tn=tc.downs.length+tc.hub.length+tc.d1.length;
  $('bd-today').textContent=tn; $('bd-today').hidden=tn===0;
}

/* ═══════════════ 화면: 대시보드 ═══════════════ */
function vDash(){
  const rentDown=PCS.filter(p=>p.st==='down'&&p.order);
  const idleDown=PCS.filter(p=>p.st==='down'&&!p.order);
  const exp=ORDERS.filter(o=>o.left<=SET.notiDay);
  const monthAmt=ORDERS.reduce((s,o)=>s+o.amt,0);
  return `
  <div class="top"><h1>대시보드</h1>
    <span class="live"><span class="dt"></span>하트비트 수신 중 · <b class="num" id="tick">방금</b></span>
    <div class="sp"><a class="btn btn-o btn-sm" href="index.html" target="_blank">고객 사이트 열기 ↗</a></div>
  </div>
  <div class="grid kpis" style="margin-bottom:14px">
    <div class="card kpi"><span class="l">전체 보유</span><b class="num">${w(PCS.length)}대</b>
      <span class="sub">K ${seq.K} · Y ${seq.Y} · D ${seq.D}</span></div>
    <div class="card kpi"><span class="l">임대중</span><b class="num">${w(cnt('rent'))}대</b>
      <span class="sub">가동률 ${Math.round(cnt('rent')/PCS.length*100)}%</span></div>
    <div class="card kpi"><span class="l">임대 가능</span><b class="num" style="color:var(--gr)">${w(cnt('ok'))}대</b>
      <span class="sub">홈페이지 노출 중</span></div>
    <div class="card kpi ${cnt('down')?'crit':''}"><span class="l">다운</span><b class="num">${cnt('down')}대</b>
      <span class="sub">임대중 ${rentDown.length} · 재고 ${idleDown.length}</span></div>
    <div class="card kpi"><span class="l">미등록 / 미검증</span><b class="num">${cnt('new')} / ${cnt('unv')}</b>
      <span class="sub">등록 절차 대기</span></div>
    <div class="card kpi"><span class="l">이용중 주문액</span><b class="num">${w(Math.round(monthAmt/10000))}만원</b>
      <span class="sub">주문 ${ORDERS.length}건</span></div>
  </div>
  <div class="grid" style="grid-template-columns:1.2fr 1fr">
    <div class="card">
      <div class="sec-h"><h3>🚨 임대중 PC 다운 — 최우선</h3><span class="cnt">${rentDown.length}</span></div>
      <div class="sec-b">${rentDown.length? `<table class="tbl"><tbody>`+rentDown.map(p=>`
        <tr data-pc="${p.pn}"><td class="pn">${p.pn}</td><td class="dim">${locStr(p)}</td>
        <td>${p.order.nm} <span class="dim">${p.order.ph}</span></td>
        <td>${stTag(p)}</td></tr>`).join('')+`</tbody></table>`
        : `<div class="empty2"><b>다운된 임대중 PC가 없습니다</b>모든 고객 PC가 정상 신호를 보내고 있습니다.</div>`}
      </div>
    </div>
    <div class="card">
      <div class="sec-h"><h3>⏳ 만료 임박 (D-${SET.notiDay} 이내)</h3><span class="cnt">${exp.length}</span>
        <div class="r"><a class="btn btn-o btn-sm" href="#noti">알림 발송 →</a></div></div>
      <div class="sec-b"><table class="tbl"><tbody>${exp.slice(0,8).map(o=>`
        <tr data-ord="${o.no}"><td class="pn">${o.pc.pn}</td><td>${o.nm}</td>
        <td class="dim">${fmtD(o.end)} 만료</td>
        <td><b style="color:${o.left<=2?'var(--red)':'var(--org)'}">D-${o.left}</b></td></tr>`).join('')}
      </tbody></table></div>
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="sec-h"><h3>🧾 최근 주문</h3><div class="r"><a class="btn btn-o btn-sm" href="#orders">전체 보기 →</a></div></div>
    <div class="sec-b"><table class="tbl">
      <thead><tr><th>주문번호</th><th>품번</th><th>사양</th><th>회원</th><th>결제</th><th>기간</th><th>금액</th><th></th></tr></thead>
      <tbody>${ORDERS.slice().sort(()=>0).slice(0,7).map(o=>`
      <tr data-ord="${o.no}"><td class="dim num">${o.no}</td><td class="pn">${o.pc.pn}</td>
      <td>${o.pc.spec.n}</td><td>${o.nm}${o.mis?' <span class="warnbadge">⚠ 명의다름</span>':''}</td>
      <td class="dim">${o.pm}</td><td class="dim num">${o.days}일</td>
      <td class="num"><b>${w(o.amt)}원</b></td>
      <td class="dim">D-${o.left}</td></tr>`).join('')}</tbody></table></div>
  </div>`;
}

/* ═══════════════ 화면: 미등록 PC ═══════════════ */
function vNew(){
  const list=PCS.filter(p=>p.st==='new');
  return `
  <div class="top"><h1>미등록 PC</h1>
    <span class="live">세팅 프로그램에서 올라온 PC · 품번을 부여하면 <b>미검증</b> 단계로 넘어갑니다</span></div>
  <div class="card">
    <div class="sec-h"><h3>등록 대기</h3><span class="cnt">${list.length}</span></div>
    <div class="sec-b">${list.length? `<table class="tbl">
      <thead><tr><th>세팅자 입력 위치</th><th>애니데스크 번호</th><th>자동 수집 사양</th><th>비번 입력</th><th>품번 부여</th><th></th></tr></thead>
      <tbody>${list.map(p=>{
        const next=p.room+'-'+pad(seq[p.room]+1);
        return `<tr><td class="pn">${locStr(p)}</td>
        <td class="num">${p.ad.replace(/(\d{3})(\d{3})(\d{3})/,'$1 $2 $3')}</td>
        <td class="dim">${p.spec.n} · 램${p.spec.ram}G · SSD${p.spec.ssd}G</td>
        <td><span class="tag t-ok"><i></i>입력됨 · 2회 확인</span></td>
        <td><input value="${next}" data-pnin="${p.ad}" style="width:90px;height:32px;border:1px solid var(--line);border-radius:7px;padding:0 9px;font-weight:800"></td>
        <td><button class="btn btn-b btn-sm" data-assign="${p.ad}">품번 부여</button></td></tr>`}).join('')}
      </tbody></table>`
      : `<div class="empty2"><b>대기 중인 PC가 없습니다</b>세팅 프로그램으로 등록하면 여기 표시됩니다.</div>`}
    </div>
  </div>
  <div class="card" style="margin-top:14px"><div class="sec-b pad" style="font-size:13px;color:var(--ink3);line-height:1.8">
    <b style="color:var(--ink)">현장 세팅 순서</b> — ① 포맷 · 애니데스크 설치 · 번호와 비밀번호 설정(기존과 동일)
    ② 세팅 프로그램 실행 → 위치(서버실·랙-층-자리)와 비밀번호 입력 ③ 여기서 품번 부여
    ④ 다른 PC에서 접속 테스트 후 <b style="color:var(--ink)">검증 대기</b> 화면에서 확인 → 판매 재고 전환
  </div></div>`;
}

/* ═══════════════ 화면: 검증 대기 ═══════════════ */
function vVerify(){
  const list=PCS.filter(p=>p.st==='unv');
  return `
  <div class="top"><h1>검증 대기</h1>
    <span class="live">담당자가 실제 접속을 확인해야 판매 재고로 올라갑니다 · 확인 전에는 고객에게 보이지 않습니다</span></div>
  <div class="card">
    <div class="sec-h"><h3>접속 확인 대기</h3><span class="cnt">${list.length}</span></div>
    <div class="sec-b">${list.length? `<table class="tbl">
      <thead><tr><th>품번</th><th>위치</th><th>사양</th><th>애니데스크</th><th>비밀번호</th><th></th></tr></thead>
      <tbody>${list.map(p=>`
      <tr><td class="pn">${p.pn}</td><td class="dim">${locStr(p)}</td>
      <td class="dim">${p.spec.n}</td>

      <td><span class="mask" data-pwm="${p.pn}">••••••</span>
        <button class="btn btn-o btn-sm" data-pwshow="${p.pn}">보기</button></td>
      <td style="display:flex;gap:6px">
        <button class="btn btn-g btn-sm" data-verok="${p.pn}">접속 확인 완료 → 판매</button>
        <button class="btn btn-o btn-sm" data-verfail="${p.pn}">접속 실패 → 점검</button></td></tr>`).join('')}
      </tbody></table>`
      : `<div class="empty2"><b>검증 대기 PC가 없습니다</b></div>`}
    </div>
  </div>`;
}

/* ═══════════════ 화면: 오늘 할 일 ═══════════════ */
function todayCounts(){
  const downs=PCS.filter(p=>p.st==='down');
  const g={}; downs.forEach(p=>{const k=p.roomName+' '+p.rack+'랙 '+p.fl+'층';(g[k]=g[k]||[]).push(p)});
  const hub=Object.entries(g).filter(e=>e[1].length>=2);
  return {downs,hub,fix:PCS.filter(p=>p.st==='fix'),d1:ORDERS.filter(o=>o.left<=1)};
}
function vToday(){
  const {downs,hub,fix,d1}=todayCounts();
  const rentFirst=downs.slice().sort((a,b)=>((b.order?1:0)-(a.order?1:0)));
  const hubKeys=new Set(hub.flatMap(e=>e[1].map(p=>p.pn)));
  return `
  <div class="top"><h1>오늘 할 일</h1>
    <span class="live">현장에서 처리할 순서대로 — 고객 영향이 큰 것부터</span></div>
  <div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:14px">
    <div class="card">
      <div class="sec-h"><h3>🔌 랙 장애 의심 — 허브·회선 먼저 확인</h3><span class="cnt">${hub.length}</span></div>
      <div class="sec-b">${hub.length? hub.map(([k,l])=>`
        <div style="padding:12px 18px;border-bottom:1px solid var(--line2)">
          <b style="color:var(--red)">${k}</b> — 같은 층에서 <b>${l.length}대</b> 동시 무신호

/* ═══════════════ 화면: 랙맵 (구조 편집 포함) ═══════════════ */
let RSEL={room:'Y',rack:1,edit:false};
function vRack(){
  const r=ROOMS.find(x=>x.k===RSEL.room);
  const cfgList=RACKS[r.k];
  if(RSEL.rack>cfgList.length)RSEL.rack=cfgList.length;
  const cfg=cfgList[RSEL.rack-1];
  const inRoom=PCS.filter(p=>p.room===r.k);
  const inRack=rackOcc(r.k,RSEL.rack);
  const roomCard=rm=>{
    const l=PCS.filter(p=>p.room===rm.k);
    const seg=(st,c)=>{const n=l.filter(p=>p.st===st).length;
      return n?'<i style="width:'+(n/l.length*100)+'%;background:'+c+'"></i>':''};
    return `<div class="card roomcard ${RSEL.room===rm.k?'on':''}" data-room="${rm.k}">
      <b>${rm.name} <span style="font-size:12px;color:var(--ink4)">(${rm.k})</span></b>
      <div class="sub">${RACKS[rm.k].length}랙 · ${l.length}대 · 다운 ${l.filter(p=>p.st==='down').length}</div>
      <div class="bar">${seg('rent','#3B62E8')}${seg('ok','#12B76A')}${seg('fix','#E08B00')}${seg('down','#E2233C')}${seg('unv','#8A94A6')}${seg('new','#8A4DE8')}</div>
    </div>`};
  const rackBtns=cfgList.map((c,i)=>{
    const n=i+1, down=inRoom.some(p=>p.rack===n&&p.st==='down');
    return `<button class="rackbtn ${RSEL.rack===n?'on':''}" data-rack="${n}">${n}번 랙${down?'<span class="d"></span>':''}</button>`}).join('')
    +`<button class="rackbtn" data-rkadd style="border-style:dashed;color:var(--blue)">＋ 랙 추가</button>`;
  /* 층은 위에서부터 높은 층 → 1층이 맨 아래 · 자리는 오른쪽 끝이 1번 */
  let map='';
  for(let fl=cfg.length;fl>=1;fl--){
    const sc=cfg[fl-1];
    let cells='';
    for(let slot=sc;slot>=1;slot--){
      const p=inRack.find(x=>x.fl===fl&&x.slot===slot);
      cells += p
        ? `<div class="slot s-${p.st}" data-pc="${p.pn||p.ad}" title="${p.pn||'미등록'} · ${ST[p.st]}">${slot}</div>`
        : `<div class="slot s-empty" title="빈 자리">${slot}</div>`;
    }
    map+=`<div class="floor"><span class="fl">${fl}층</span><div class="slots">${cells}</div>
      <span class="flcnt num">${inRack.filter(x=>x.fl===fl).length}/${sc}</span></div>`;
  }
  /* 구조 편집 패널 */
  const canDel=inRack.length===0 && RSEL.rack===cfgList.length && cfgList.length>1;
  const edit=!RSEL.edit?'':`
  <div class="editpanel">
    <div class="ep-h"><b>${r.name} ${RSEL.rack}번 랙 구조 수정</b>
      <span>층마다 자리 수가 달라도 됩니다 (예: 7·7·7·5) · 이미 PC가 있는 자리보다 줄일 수 없습니다</span></div>
    ${cfg.map((sc,i)=>{const fl=i+1, mx=floorMaxSlot(r.k,RSEL.rack,fl), used=inRack.filter(x=>x.fl===fl).length;
      return `<div class="ep-row"><b>${fl}층</b>
        <input type="number" min="${Math.max(mx,1)}" max="30" value="${sc}" data-flslot="${fl}">
        <span>자리 · 사용중 ${used}대${mx?` · 최대 점유 자리 ${mx}번`:''}</span>
        ${fl===cfg.length&&cfg.length>1? (used===0
          ? `<button class="btn btn-o btn-sm" data-flrm>맨 위층 제거</button>`
          : `<span class="ep-dim">PC가 있어 제거 불가</span>`):''}
      </div>`}).reverse().join('')}
    <div class="ep-acts">
      <button class="btn btn-o btn-sm" data-fladd>＋ 층 추가 (맨 위)</button>
      <button class="btn btn-b btn-sm" data-rksave>구조 저장</button>
      ${canDel? `<button class="btn btn-o btn-sm" data-rkdel style="color:var(--red);border-color:#F7CDD3">이 랙 삭제</button>`
        : `<span class="ep-dim">랙 삭제는 비어 있는 마지막 번호 랙만 가능합니다</span>`}
      <span id="ep-msg" style="color:var(--gr);font-weight:700;font-size:12.5px"></span>
    </div>
  </div>`;
  return `
  <div class="top"><h1>랙맵</h1>
    <span class="live">칸을 누르면 PC 상세 · 랙 구조는 여기서 직접 추가·수정합니다</span>
    <div class="sp"><button class="btn ${RSEL.edit?'btn-b':'btn-o'} btn-sm" data-rkedit>
      ${RSEL.edit?'편집 닫기':'🛠 이 랙 구조 수정'}</button></div></div>
  <div class="grid rooms3" style="margin-bottom:14px">${ROOMS.map(roomCard).join('')}</div>
  <div class="card">
    <div class="rackrow">${rackBtns}</div>
    ${edit}
    <div class="rackmap">${map}</div>
    <div class="dirnote">▶ 자리 번호는 <b>오른쪽 끝이 1번</b>입니다 (랙 정면 기준) · 1층이 맨 아래</div>
    <div class="legend">
      <span><i style="background:#3B62E8"></i>임대중</span>
      <span><i style="background:#12B76A"></i>임대 가능</span>
      <span><i style="background:#E2233C"></i>다운</span>
      <span><i style="background:#E08B00"></i>점검중</span>
      <span><i style="background:#8A94A6"></i>미검증</span>
      <span><i style="background:#8A4DE8"></i>미등록</span>
      <span><i style="background:#fff;border:1px solid var(--line)"></i>빈 자리</span>
    </div>
  </div>`;
}

/* 회원 목록은 주문에서 그때그때 만들어 냅니다.
   전에는 화면을 열 때 딱 한 번만 계산해서, 서버 주문을 받아온 뒤에도
   예전 값이 그대로 남아 있었습니다. */
function membersOf(){
  const map=new Map();
  ORDERS.forEach(o=>{
    const key=o.ph;
    if(!map.has(key)) map.set(key,{nm:o.nm,ph:o.ph,via:o.via,orders:[],pcs:[],amt:0,joined:null});
    const m=map.get(key);
    m.orders.push(o); m.pcs.push(o.pc); m.amt+=o.amt;
    if(!m.joined||o.start<m.joined) m.joined=o.start;
    if(o.mis) m.mis=true;
  });
  return [...map.values()].sort((a,b)=>b.amt-a.amt);
}
const viaLabel=v=>v==='kakao'?'카카오':v==='google'?'구글':'수동등록';

    <div class="card kpi ${MEMBERS.filter(m=>m.mis).length?'crit':''}"><span class="l">명의 다름</span>

let FQ='';

    pcHits=PCS.filter(p=>(p.pn||'').toLowerCase().includes(q)||p.ad.includes(qp)
      ||locStr(p).includes(q)||p.ip.includes(q)).slice(0,8);
    ordHits=ORDERS.filter(o=>o.nm.includes(FQ)||o.userNm.includes(FQ)
      ||(o.payer&&o.payer.includes(FQ))||(o.depositor&&o.depositor.includes(FQ))

  return `

    </div>
    <div class="blockttl">환불 계산 (확정 규정 자동 적용)</div>
    ${(()=>{const used=o.days-o.left;
      if(used>7) return `<div class="mismatch" style="background:#F2F4F8;border-color:var(--line);color:var(--ink3)">
        사용 ${used}일 — <b style="color:var(--ink)">7일 경과로 환불 불가</b> 규정입니다. (개별 협의는 별도)</div>`;
      const refund=Math.max(0,Math.round(o.amt/o.days*o.left)-SET.setup);
      return `<div class="credbox"><div class="cb">
        <div class="cr"><span>사용 ${used}일 / 결제 ${o.days}일 · 남은 ${o.left}일</span><b></b></div>
        <div class="cr"><span>일할 잔액 (${w(o.amt)} ÷ ${o.days} × ${o.left})</span><b class="num">${w(Math.round(o.amt/o.days*o.left))}원</b></div>
        <div class="cr"><span>초기 세팅비 차감</span><b class="num" style="color:var(--red)">−${w(SET.setup)}원</b></div>
        <div class="cr" style="border-top:1px solid var(--line);padding-top:8px;margin-top:2px">
          <span><b>환불 예정액</b></span><b class="num" style="font-size:16px;color:var(--red)">${w(refund)}원</b></div>
      </div></div>`})()}
  </div>
  <div class="dracts">
    <button class="btn btn-b" data-copycust="${o.no}">📋 고객 전달용 복사 (위치 제외)</button>
    <button class="btn btn-o" data-resend="${o.no}">문자 재발송</button>
    <button class="btn btn-o" data-extend="${o.no}">30일 연장</button>
    <button class="btn btn-o" data-close>닫기</button>
  </div>`;
  $('drawer').classList.add('on');$('overlay').classList.add('on');
}
function closeDrawer(){$('drawer').classList.remove('on');$('overlay').classList.remove('on')}

/* ═══════════════ 드로어: 수동 주문 등록 (스마트스토어 병행) ═══════════════ */
function openManual(){
  const avail=PCS.filter(p=>p.st==='ok').slice(0,120);
  $('drawer').innerHTML=`
  <div class="hd"><b>수동 주문 등록</b><span class="tag t-fix"><i></i>스마트스토어 · 전화 주문</span>
    <button class="x" data-close>✕</button></div>
  <div class="bd">
    <p class="dim" style="font-size:13px;margin-bottom:14px">
      스마트스토어·전화로 들어온 주문을 한 번만 등록하면, 이후 만료 알림·연장·검색이 전부 자동으로 걸립니다.</p>
    <div class="kv">
      <span class="k">PC 선택</span><span class="v">
        <select id="m-pc" style="width:100%;height:38px;border:1px solid var(--line);border-radius:8px">
          ${avail.map(p=>`<option value="${p.pn}">${p.pn} — ${p.spec.n} (${w(p.spec.p)}원/30일)</option>`).join('')}
        </select></span>
      <span class="k">고객명</span><span class="v">
        <input id="m-nm" placeholder="주문자 성함" style="width:100%;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 11px"></span>
      <span class="k">연락처</span><span class="v">
        <input id="m-ph" placeholder="010-0000-0000" style="width:100%;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 11px"></span>
      <span class="k">기간</span><span class="v">
        <select id="m-days" style="height:38px;border:1px solid var(--line);border-radius:8px">
          <option value="30">30일</option><option value="60">60일 (−${SET.off60}%)</option><option value="90">90일 (−${SET.off90}%)</option>
        </select></span>
      <span class="k">경로</span><span class="v">
        <select id="m-pm" style="height:38px;border:1px solid var(--line);border-radius:8px">
          <option>스마트스토어</option><option>가상계좌</option><option>신용카드</option><option>전화 주문</option>
        </select></span>
      <span class="k">이용자</span><span class="v">
        <label style="display:flex;align-items:center;gap:7px;font-size:13.5px;cursor:pointer">
          <input type="checkbox" id="m-mis" style="width:16px;height:16px"> 결제자와 다른 사람이 사용</label>
        <div id="m-misbox" hidden style="margin-top:7px;display:flex;gap:6px">
          <input id="m-unm" placeholder="이용자 성함" style="flex:1;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px">
          <input id="m-uph" placeholder="이용자 연락처" style="flex:1.3;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px">
        </div></span>
    </div>
    <div id="m-msg" style="font-size:12.5px;color:var(--red);font-weight:700;min-height:18px"></div>
  </div>
  <div class="dracts">
    <button class="btn btn-r" data-mansave>등록하고 임대중으로 전환</button>
    <button class="btn btn-o" data-close>취소</button>
  </div>`;
  $('drawer').classList.add('on');$('overlay').classList.add('on');
}

/* ═══════════════ 라우터 ═══════════════ */
const VIEWS={dash:vDash,newpc:vNew,verify:vVerify,today:vToday,rack:vRack,pcs:vPcs,members:vMembers,orders:vOrders,noti:vNoti,find:vFind,set:vSet};
function route(){
  const v=(location.hash||'#dash').slice(1);
  const fn=VIEWS[v]||vDash;
  $('main').innerHTML=fn();
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  badges();
  if(v==='find'){const q=$('findq'); if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
}
addEventListener('hashchange',route);

/* ═══════════════ 이벤트 (전부 위임 — 재렌더에도 안 죽는다) ═══════════════ */
/* 서버에 저장·조회하는 동작이 있어 async 입니다 (await 를 쓸 수 있어야 합니다) */
document.addEventListener('click',async e=>{
  const t=e.target;
  if(t.closest('[data-close]')||t.id==='overlay'){closeDrawer();return}

  const pc=t.closest('[data-pc]');
  if(pc&&!t.closest('button')){openPc(pc.dataset.pc);return}
  const od=t.closest('[data-ord]');
  if(od&&!t.closest('button')){openOrd(od.dataset.ord);return}

  const rm=t.closest('[data-room]');
  if(rm){RSEL.room=rm.dataset.room;RSEL.rack=1;RSEL.edit=false;route();return}
  const rk=t.closest('[data-rack]');
  if(rk){RSEL.rack=+rk.dataset.rack;route();return}

  /* ── 랙 구조 편집 ── */
  if(t.closest('[data-rkedit]')){RSEL.edit=!RSEL.edit;route();return}
  if(t.closest('[data-rkadd]')){
    RACKS[RSEL.room].push([SLOTS,SLOTS,SLOTS,SLOTS]);
    RSEL.rack=RACKS[RSEL.room].length; RSEL.edit=true;
    saveRacks(); route(); return;
  }
  if(t.closest('[data-fladd]')){
    RACKS[RSEL.room][RSEL.rack-1].push(SLOTS);
    saveRacks(); route(); return;
  }
  if(t.closest('[data-flrm]')){
    const c=RACKS[RSEL.room][RSEL.rack-1];
    if(c.length<=1)return;
    if(rackOcc(RSEL.room,RSEL.rack).some(p=>p.fl===c.length)){alert('맨 위층에 PC가 있어 제거할 수 없습니다.');return}
    c.pop(); saveRacks(); route(); return;
  }
  if(t.closest('[data-rksave]')){
    const c=RACKS[RSEL.room][RSEL.rack-1];
    const inputs=document.querySelectorAll('[data-flslot]');
    for(const inp of inputs){
      const fl=+inp.dataset.flslot, v=parseInt(inp.value,10);
      const mx=floorMaxSlot(RSEL.room,RSEL.rack,fl);
      if(!(v>=1&&v<=30)){alert(fl+'층 자리 수는 1~30 사이여야 합니다.');return}
      if(v<mx){alert(fl+'층에는 '+mx+'번 자리까지 PC가 있어 '+v+'자리로 줄일 수 없습니다.');return}
    }
    inputs.forEach(inp=>{c[+inp.dataset.flslot-1]=parseInt(inp.value,10)});
    saveRacks(); RSEL.edit=false; route(); return;
  }
  if(t.closest('[data-rkdel]')){
    if(rackOcc(RSEL.room,RSEL.rack).length){alert('PC가 있는 랙은 삭제할 수 없습니다.');return}
    if(RSEL.rack!==RACKS[RSEL.room].length){alert('마지막 번호 랙만 삭제할 수 있습니다. (중간 랙을 지우면 뒤 랙들의 위치 표기가 전부 밀립니다)');return}
    if(!confirm(RSEL.rack+'번 랙을 삭제할까요?'))return;
    RACKS[RSEL.room].pop(); RSEL.rack=RACKS[RSEL.room].length; RSEL.edit=false;
    saveRacks(); route(); return;
  }

  const pg=t.closest('[data-pg]');
  if(pg&&!pg.disabled){PF.pg=+pg.dataset.pg;route();return}
  const opg=t.closest('[data-opg]');
  if(opg&&!opg.disabled){OF.pg=+opg.dataset.opg;route();return}

  /* 미등록 → 품번 부여 → 미검증 */
  const asg=t.closest('[data-assign]');
  if(asg){
    const p=PCS.find(x=>x.ad===asg.dataset.assign); if(!p)return;
    const inp=document.querySelector('[data-pnin="'+p.ad+'"]');
    const val=(inp&&inp.value.trim().toUpperCase())||'';
    if(!/^[KYD]-\d{3}$/.test(val)){alert('품번 형식은 K-001 · Y-042 · D-113 입니다.');return}
    if(PCS.some(x=>x.pn===val)){alert(val+' 은 이미 사용 중인 품번입니다.');return}
    asg.disabled=true;
    const r=await pcSave(p.pn||'', {pn:val, room:val.charAt(0), status:'unv'});
    asg.disabled=false;
    if(!r.ok){alert(r.error);return}
    p.pn=val; p.st='unv'; seq[p.room]=Math.max(seq[p.room],parseInt(val.slice(2),10));
    route();return;
  }
  /* 검증 확인 / 실패 / 점검 전환 — 서버에 먼저 저장합니다 */
  const stBtn = t.closest('[data-verok]')||t.closest('[data-verfail]')
              ||t.closest('[data-tofix]')||t.closest('[data-took]');
  if(stBtn){
    const d=stBtn.dataset;
    const pn=d.verok||d.verfail||d.tofix||d.took;
    const to=(d.verok||d.took)?'ok':'fix';
    const p=PCS.find(x=>x.pn===pn); if(!p)return;
    stBtn.disabled=true;
    const r=await pcSave(pn,{status:to});
    stBtn.disabled=false;
    if(!r.ok){alert(r.error);return}
    p.st=to;
    if(d.verok||d.tofix||d.took) closeDrawer();
    route(); return;
  }

  /* 회원 관리 */
  const mem=t.closest('[data-mem]');
  if(mem&&!t.closest('button')){openMem(mem.dataset.mem);return}
  const snd=t.closest('[data-send]');
  if(snd){openMem(snd.dataset.send);return}
  const mpg=t.closest('[data-mpg]');
  if(mpg&&!mpg.disabled){MF.pg=+mpg.dataset.mpg;route();return}
  if(t.closest('[data-mrisk]')){MF.risk=!MF.risk;MF.pg=1;route();return}
  const dosend=t.closest('[data-dosend]');
  if(dosend){
    const m=membersOf().find(x=>x.ph===dosend.dataset.dosend);
    const msg=$('al-msg').value.trim();
    if(!msg){alert('보낼 내용을 입력해 주세요.');return}
    logView(m.pcs[0].pn,'알림 발송 — '+m.nm+' ('+m.ph+')');
    dosend.textContent='✓ 발송 요청됨'; dosend.disabled=true;
    setTimeout(()=>{closeDrawer();
      alert('실서비스에서는 여기서 알림톡이 발송되고,\n실패 시 문자로 자동 전환됩니다.\n\n대상: '+m.nm+' ('+m.ph+')')},400);
    return;
  }
  /* PC 정보 수정 (품번 · 애니번호 · 비번 · 위치 · 메모) */
  const ep=t.closest('[data-editpc]');
  if(ep){openPc(ep.dataset.editpc, !ep.dataset.off);return}
  const sv=t.closest('[data-savepc]');
  if(sv){
    const p=PCS.find(x=>x.pn===sv.dataset.savepc||x.ad===sv.dataset.savepc); if(!p)return;
    const msg=s=>{const m=$('e-msg');if(m)m.textContent=s};
    const pn=$('e-pn').value.trim().toUpperCase();
    const ad=$('e-ad').value.trim();
    const pw=$('e-pw').value.trim();
    const room=$('e-room').value, rack=+$('e-rack').value, fl=+$('e-fl').value, slot=+$('e-slot').value;
    const memo=$('e-memo').value.trim();
    if(pn && !/^[KYD]-\d{3}$/.test(pn)){msg('품번 형식은 K-001 · Y-042 · D-113 입니다');return}
    if(pn && pn.charAt(0)!==room){msg('품번 앞글자('+pn.charAt(0)+')와 서버실('+room+')이 다릅니다');return}
    if(pn && PCS.some(x=>x!==p&&x.pn===pn)){msg(pn+' 은 이미 사용 중인 품번입니다');return}
    if(!/^\d{6,12}$/.test(ad)){msg('애니데스크 번호는 숫자 6~12자리입니다');return}
    if(PCS.some(x=>x!==p&&x.ad===ad)){msg('이미 다른 PC에 등록된 애니데스크 번호입니다');return}
    if(pw && pw.length<4){msg('비밀번호는 4자 이상이어야 합니다');return}
    const cfgL=RACKS[room];
    if(rack<1||rack>cfgL.length){msg(room+' 서버실에는 '+cfgL.length+'번 랙까지 있습니다');return}
    const cfg=cfgL[rack-1];
    if(fl<1||fl>cfg.length){msg(rack+'번 랙은 '+cfg.length+'층까지입니다');return}
    if(slot<1||slot>cfg[fl-1]){msg(fl+'층은 '+cfg[fl-1]+'자리까지입니다');return}
    const taken=PCS.find(x=>x!==p&&x.room===room&&x.rack===rack&&x.fl===fl&&x.slot===slot);
    if(taken){msg('그 자리에는 이미 '+(taken.pn||'미등록 PC')+' 가 있습니다');return}
    /* ★ 서버에 먼저 저장합니다. 서버가 거절하면 화면도 바꾸지 않습니다.
       (화면만 바꾸면 30초 뒤 서버 값으로 되돌아가 "저장이 안 된다"가 됩니다) */
    sv.disabled=true; msg('저장하는 중…');
    const st = (pn && p.st==='new') ? 'unv' : undefined;
    const r = await pcSave(p.pn||'', {pn, room, rack, fl, slot, anydesk:ad, pw, status:st, note:memo});
    sv.disabled=false;
    if(!r.ok){ msg(r.error); return; }

    /* 검증 통과 — 화면에도 적용 + 기록 */
    const before=locStr(p);
    if(pn && pn!==p.pn){
      logView(pn,'품번 변경 '+(p.pn||'미등록')+' → '+pn);
      p.pn=pn; if(p.st==='new')p.st='unv';
      seq[room]=Math.max(seq[room],parseInt(pn.slice(2),10));
    }
    if(ad!==p.ad){logView(p.pn||ad,'애니데스크 번호 변경');p.ad=ad}
    if(pw){p.pw=pw; delete p._pw; logView(p.pn||p.ad,'애니데스크 비밀번호 변경')}
    if(room!==p.room||rack!==p.rack||fl!==p.fl||slot!==p.slot){
      p.room=room; p.roomName=ROOMS.find(r=>r.k===room).name;
      p.rack=rack; p.fl=fl; p.slot=slot;
      logView(p.pn||p.ad,'위치 이동 '+before+' → '+locStr(p));
    }
    p.memo=memo;
    route(); openPc(p.pn||p.ad); return;
  }

  /* 비번 열람 — 누르는 순간 서버에 물어보고, 서버가 기록을 남깁니다 */
  const ps=t.closest('[data-pwshow]');
  if(ps){
    const p=PCS.find(x=>x.pn===ps.dataset.pwshow||x.ad===ps.dataset.pwshow); if(!p)return;
    const m=document.querySelector('[data-pwm="'+ps.dataset.pwshow+'"]');
    ps.textContent='…'; ps.disabled=true;
    const pw=await getPw(p);
    if(pw===null){ ps.textContent='실패'; ps.disabled=false;
      setTimeout(()=>{ps.textContent='보기'},1600); return; }
    if(m){ m.textContent = pw || '아직 등록 안 됨'; m.classList.remove('mask'); }
    logView(p.pn||p.ad); ps.remove(); return;
  }
  if(t.id==='dr-pwbtn'){
    const p=PCS.find(x=>x.pn===t.dataset.pn||x.ad===t.dataset.pn); if(!p)return;
    t.textContent='…'; t.disabled=true;
    const pw=await getPw(p);
    if(pw===null){ t.textContent='실패'; t.disabled=false;
      setTimeout(()=>{t.textContent='보기'},1600); return; }
    $('dr-pw').textContent = pw || '아직 등록 안 됨';
    $('dr-pw').classList.remove('mask');
    logView(p.pn||p.ad); t.remove(); return;
  }

  /* 수동 주문 등록 */
  if(t.closest('[data-manual]')){openManual();return}
  if(t.id==='m-mis'){$('m-misbox').hidden=!t.checked;return}
  if(t.closest('[data-mansave]')){
    const msg=s=>{$('m-msg').textContent=s};
    const p=PCS.find(x=>x.pn===$('m-pc').value);
    const nm=$('m-nm').value.trim(), ph=$('m-ph').value.trim();
    const days=+$('m-days').value, pm=$('m-pm').value;
    const mis=$('m-mis').checked, unm=$('m-unm')?$('m-unm').value.trim():'', uph=$('m-uph')?$('m-uph').value.trim():'';
    if(!p){msg('PC를 선택해 주세요');return}
    if(p.st!=='ok'){msg(p.pn+' 은 방금 다른 상태로 바뀌었습니다');return}
    if(nm.length<2){msg('고객명을 입력해 주세요');return}
    if(!/^01[016789]-?\d{3,4}-?\d{4}$/.test(ph)){msg('연락처 형식을 확인해 주세요 (010-0000-0000)');return}
    if(mis&&unm.length<2){msg('이용자 성함을 입력해 주세요');return}
    const off=days===60?SET.off60:days===90?SET.off90:0;
    const amt=Math.round(p.spec.p*days/30*(100-off)/100);
    const start=new Date(TODAY), end=new Date(TODAY); end.setDate(end.getDate()+days);

    /* ★ 서버에 먼저 등록합니다.
       스마트스토어·전화 주문이 여기로 들어옵니다. 서버에 남지 않으면
       고객 화면에서는 그 PC 가 계속 "임대 가능"으로 보입니다. */
    if(LIVE){
      const btn=t.closest('[data-mansave]');
      btn.disabled=true; msg('등록하는 중…');
      let r;
      try{
        const rs=await fetch('/api/admin?do=order-manual',{method:'POST',credentials:'same-origin',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({pn:p.pn, specId:p.spec.id, days, name:nm, phone:ph,
            payMethod:pm, amount:amt,
            payerName:nm, userName:mis?unm:nm, userPhone:mis?uph:ph})});
        r=await rs.json().catch(()=>({}));
        if(!rs.ok){ btn.disabled=false; msg(r.error||('등록 실패 ('+rs.status+')')); return; }
      }catch(e){ btn.disabled=false; msg('서버에 연결하지 못했습니다'); return; }
      btn.disabled=false;
    }
    const o={no:'2608-'+(ono++), pc:p, nm, ph, via:'manual', payer:nm,
      userNm:mis?unm:nm, userPh:mis?uph:null, mis, pm,
      card:null, depositor:pm==='가상계좌'?nm:null, days, amt, start, end, left:days};
    ORDERS.push(o); ORDERS.sort((a,b)=>a.left-b.left);
    p.st='rent'; p.order=o;
    logView(p.pn,'수동 주문 등록 — '+nm+' ('+pm+')');
    closeDrawer(); route(); openOrd(o.no); return;
  }
  /* 고객 전달용 복사 — 위치는 절대 포함하지 않는다 */
  const cp2=t.closest('[data-copycust]');
  if(cp2){
    const o=ORDERS.find(x=>x.no===cp2.dataset.copycust); if(!o)return;
    const p=o.pc;
    const pw=await getPw(p);      // 서버에서 한 번 꺼내옵니다 (기록 남음)
    if(pw===null){ cp2.textContent='비밀번호를 가져오지 못했습니다';
      setTimeout(()=>{cp2.textContent='📋 고객 전달용 복사 (위치 제외)'},2000); return; }
    const txt='[한국 가상컴] '+o.nm+'님의 가상컴 안내\n'
      +'문의번호: '+p.pn+'\n'
      +'접속 주소: '+p.ad.replace(/(\d{3})(\d{3})(\d{3})/,'$1 $2 $3')+'\n'
      +'비밀번호: '+(pw||'미등록')+'\n'
      +'이용 기간: '+fmtD(o.start)+' ~ '+fmtD(o.end)+'\n'
      +'문의: 카카오톡 채널 「한국 가상컴」 또는 010-2323-4060';
    (navigator.clipboard? navigator.clipboard.writeText(txt):Promise.reject())
      .then(()=>{cp2.textContent='✓ 복사됨 (위치 미포함)';setTimeout(()=>{cp2.textContent='📋 고객 전달용 복사 (위치 제외)'},1600)})
      .catch(()=>{prompt('아래 내용을 복사하세요 (위치 미포함)',txt)});
    logView(p.pn,'고객 전달용 정보 복사'); return;
  }
  /* 알림 개별 발송 */
  const n1=t.closest('[data-noti1]');
  if(n1){n1.outerHTML='<span class="noti-st n-ok">✓ 발송 요청됨</span>';return}

  if(t.closest('[data-resend]')){alert('실서비스에서는 접속 정보 문자가 재발송됩니다.');return}
  /* 기간 연장 — 서버에 저장해야 실제로 늘어납니다 */
  const ex=t.closest('[data-extend]');
  if(ex){
    const o=ORDERS.find(x=>x.no===ex.dataset.extend); if(!o)return;
    const amt=prompt(o.nm+'님 '+o.pn+' 을 30일 연장합니다.\n받으신 금액을 적어 주세요 (원)', String(o.amt||''));
    if(amt===null)return;
    ex.disabled=true;
    if(LIVE){
      try{
        const r=await fetch('/api/admin?do=order-action',{method:'POST',credentials:'same-origin',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({no:o.no, act:'extend', days:30, amount:+amt||0})});
        const d=await r.json().catch(()=>({}));
        if(!r.ok){ ex.disabled=false; alert(d.error||'연장하지 못했습니다'); return; }
      }catch(e){ ex.disabled=false; alert('서버에 연결하지 못했습니다'); return; }
    }
    o.left+=30; if(o.end) o.end.setDate(o.end.getDate()+30);
    o.days+=30; o.amt+=(+amt||0);
    ORDERS.sort((a,b)=>a.left-b.left); closeDrawer(); route(); return;
  }
  if(t.id==='noti-all'){alert('실서비스에서는 대상 전원에게 알림톡이 발송되고,\n실패 건은 문자로 자동 전환됩니다.');return}

  if(t.id==='findgo'){FQ=$('findq').value;route();return}

  if(t.id==='set-save'){
    const next={};
    document.querySelectorAll('[data-set]').forEach(i=>{next[i.dataset.set]=+i.value||DEFSET[i.dataset.set]});
    /* 서버에 저장해야 다른 PC 에서 열어도 같고, 서버의 다운 판정과도 어긋나지 않습니다 */
    if(LIVE){
      t.disabled=true; $('set-msg').textContent='저장하는 중…';
      try{
        const r=await fetch('/api/admin?do=settings',{method:'POST',credentials:'same-origin',
          headers:{'Content-Type':'application/json'},body:JSON.stringify(next)});
        const d=await r.json().catch(()=>({}));
        t.disabled=false;
        if(!r.ok){ $('set-msg').textContent=d.error||'저장하지 못했습니다'; return; }
      }catch(e){ t.disabled=false; $('set-msg').textContent='서버에 연결하지 못했습니다'; return; }
    }
    Object.assign(SET,next);
    localStorage.setItem('kvc-set',JSON.stringify(SET));
    $('set-msg').textContent='✓ 저장되었습니다'; setTimeout(()=>{const m=$('set-msg');if(m)m.textContent=''},1800);
    badges(); return;
  }
  if(t.id==='set-reset'){SET=Object.assign({},DEFSET);localStorage.setItem('kvc-set',JSON.stringify(SET));route();return}
  if(t.id==='gate-go'){tryGate();return}
});
document.addEventListener('input',e=>{
  const f=e.target.closest('[data-f]');
  if(f){PF[f.dataset.f]=f.value.toLowerCase?f.value.toLowerCase():f.value;
    if(f.dataset.f!=='q')PF[f.dataset.f]=f.value; PF.pg=1;
    if(f.tagName==='SELECT')route(); else {clearTimeout(window._ft);window._ft=setTimeout(route,300)} return}
  const mf=e.target.closest('[data-mf]');
  if(mf){MF[mf.dataset.mf]=mf.value;MF.pg=1;
    if(mf.tagName==='SELECT')route(); else {clearTimeout(window._mt);window._mt=setTimeout(route,300)} return}
  const of=e.target.closest('[data-of]');
  if(of){OF.q=of.value;OF.pg=1;clearTimeout(window._ot);window._ot=setTimeout(route,300);return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='findq'){FQ=e.target.value;route()}
  if(e.key==='Enter'&&e.target.id==='gate-pw'){tryGate()}
  if(e.key==='Escape')closeDrawer();
});

/* ═══════════════ 게이트 ═══════════════
   서버에 관리자 비밀번호(KVC_ADMIN_PW)가 등록돼 있으면 그쪽으로 로그인합니다.
   로그인에 성공하면 서버가 8시간짜리 출입증 쿠키를 내려주고,
   그 쿠키가 있어야만 /api/pcs 가 실제 PC 정보를 내줍니다.
   아직 등록 전이면 예전처럼 화면 코드(4060)로 열리고 목업으로 돕니다. */
async function tryGate(){
  const pw=$('gate-pw').value.trim();
  $('gate-err').textContent='확인 중…';
  try{
    const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pw})});
    if(r.ok){ sessionStorage.setItem('kvc-adm','1'); $('gate').classList.add('off'); $('gate-err').textContent=''; syncLive(); return; }
    /* 429 = 너무 여러 번 틀림 (자동 대입 방지). 서버가 알려주는 문구를 그대로 보여줍니다 */
    if(r.status===401||r.status===429){
      let m='비밀번호가 맞지 않습니다';
      try{ const d=await r.json(); if(d&&d.error) m=d.error; }catch(e){}
      $('gate-err').textContent=m; $('gate-pw').value='';
      if(r.status!==429) $('gate-pw').focus();
      return;
    }
  }catch(e){ /* 서버 함수가 아직 없거나 로컬에서 연 경우 → 아래 목업 코드로 */ }
  if(pw==='4060'){ sessionStorage.setItem('kvc-adm','1'); $('gate').classList.add('off'); $('gate-err').textContent=''; }
  else{ $('gate-err').textContent='코드가 올바르지 않습니다'; $('gate-pw').value=''; $('gate-pw').focus(); }
}
if(sessionStorage.getItem('kvc-adm')==='1')$('gate').classList.add('off');
else setTimeout(()=>$('gate-pw').focus(),100);

/* ═══════════════ 실서버 연동 ═══════════════
   서버실 중계기 → /api/heartbeat → DB → 여기(/api/pcs) 로 이어집니다.
   DB 가 아직 없으면 조용히 목업으로 계속 돕니다 — 화면이 비지 않습니다. */
let LIVE=false, LIVE_AT=null;
const rooms=Object.fromEntries(ROOMS.map(r=>[r.k,r.name]));

function applyLive(d){
  PCS.length=0;
  for(const p of d.pcs){
    PCS.push({
      room:p.room, roomName:rooms[p.room]||p.room, rack:p.rack, fl:p.fl, slot:p.slot,
      pn:p.pn, st:p.status,
      /* 판매 상품과 이어지면 그 사양을, 아니면 실제로 읽어온 하드웨어를 씁니다.
         id 를 반드시 넣어야 합니다 — 수동 주문 등록이 이 값으로 상품을 지정합니다. */
      spec: SPECS.find(s=>s.id===p.spec_id) ||
            {id:p.spec_id||null, n:p.cpu||'사양 미확인', core:p.core||'',
             ram:p.ram_gb||0, ssd:p.ssd_gb||0, gpu:p.gpu||'', p:0},
      ad:p.anydesk||'', pw:'', ip:p.ip||'',
      beat:p.beatAge, live:p.live, inUse:p.in_use,
    });
  }
  /* 미등록 PC — 품번이 아직 안 붙어 신호만 오는 것들 */
  for(const u of (d.unregistered||[])){
    PCS.push({room:u.room||'K', roomName:rooms[u.room]||'', rack:0, fl:0, slot:0,
      pn:null, hwId:u.hw_id, st:'new',
      spec:{n:u.cpu||'사양 미확인',core:u.core||'',ram:u.ram_gb||0,ssd:u.ssd_gb||0,gpu:u.gpu||'',p:0},
      ad:u.anydesk||'', pw:'', ip:u.ip||'', beat:0, live:true});
  }
  ORDERS.length=0;
  LIVE=true; LIVE_AT=new Date();
  /* 랙 구조를 실제 위치에서 다시 만듭니다 — 현장 입력과 어긋날 수 없습니다 */
  RACKS=racksFromPCS();
  /* 운영 설정도 서버 값을 씁니다. 화면과 서버가 다른 값을 보면
     "관리자에는 정상인데 고객 화면에는 다운" 같은 어긋남이 생깁니다. */
  const s=d.settings||{};
  if(s.setup_fee) SET.setup   = Number(s.setup_fee);
  if(s.down_sec)  SET.downSec = Number(s.down_sec);
  if(s.noti_day)  SET.notiDay = Number(s.noti_day);
  if(s.off60)     SET.off60   = Number(s.off60);
  if(s.off90)     SET.off90   = Number(s.off90);
  const ft=document.querySelector('.ft');
  if(ft) ft.innerHTML='실서버 연동중<br><b>PC '+w(d.pcs.length)+'대 · '
    +LIVE_AT.toLocaleTimeString('ko-KR')+'</b>';
  route();
}

/* ── 애니데스크 비밀번호 꺼내기 ──────────────────────────────
   비밀번호는 화면에 미리 내려받아 두지 않습니다.
   [보기] 를 누른 그 순간에만 서버에 한 대씩 물어보고, 서버가 열람 기록을 남깁니다.
   목록(/api/pcs)에는 비밀번호가 아예 실려 오지 않습니다. */
async function getPw(p){
  if(!LIVE) return p.pw||'';            // 목업 모드
  if(p._pw!==undefined) return p._pw;   // 이 화면에서 이미 열어본 것
  if(!p.pn) return '';
  try{
    const r=await fetch('/api/admin?do=pc-secret&pn='+encodeURIComponent(p.pn),
      {credentials:'same-origin',cache:'no-store'});
    if(!r.ok) return null;
    const d=await r.json();
    p._pw=d.pw||''; p._copy=d.copyText||'';
    return p._pw;
  }catch(e){ return null; }
}

/* ── 고친 내용을 서버에 저장 ─────────────────────────────────
   이게 없으면 화면에만 반영되고, 30초 뒤 서버에서 다시 받아올 때
   원래대로 돌아갑니다. */
async function pcSave(key, patch){
  if(!LIVE) return {ok:true};           // 목업 모드에서는 화면만 바꿉니다
  try{
    const r=await fetch('/api/admin?do=pc-update',{method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({key},patch))});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) return {ok:false,error:d.error||('저장 실패 ('+r.status+')')};
    return {ok:true,pn:d.pn};
  }catch(e){ return {ok:false,error:'서버에 연결하지 못했습니다'}; }
}

/* 서버에서 받은 주문을 화면이 쓰는 모양으로 바꿔 넣습니다 */
function applyOrders(d){
  ORDERS.length=0;
  const byPn={}; for(const p of PCS) if(p.pn) byPn[p.pn]=p;
  for(const o of (d.orders||[])){
    const pc=byPn[o.pn]||null;
    const ord={
      no:o.no, pc, pn:o.pn, nm:o.nm, ph:o.ph, via:o.via, email:o.email,
      payer:o.payer, userNm:o.userNm, userPh:o.userPh, mis:o.mis,
      pm:o.pm, card:null, depositor:o.pm==='가상계좌'?o.payer:null,
      days:o.days, amt:o.amt, st:o.st,
      start:o.start?new Date(o.start):null,
      end:o.end?new Date(o.end):null,
      left:o.left==null?999:o.left,
      taxInvoice:o.taxInvoice, bizNo:o.bizNo,
      refundAmt:o.refundAmt, refundWhy:o.refundWhy,
    };
    ORDERS.push(ord);
    if(pc) pc.order=ord;      // 랙맵·PC 상세에서 "누가 쓰고 있나"를 보여줍니다
  }
  ORDERS.sort((a,b)=>a.left-b.left);
  SRV_MEMBERS = d.members||[];
  SRV_COUNTS  = d.counts||{};
}
let SRV_MEMBERS=[], SRV_COUNTS={};

async function syncLive(){
  if(sessionStorage.getItem('kvc-adm')!=='1') return;
  try{
    const r=await fetch('/api/admin?do=pcs',{credentials:'same-origin',cache:'no-store'});
    if(!r.ok) return;                       // 401(미로그인)·503(DB 없음) → 목업 유지
    const d=await r.json();
    if(!(d && Array.isArray(d.pcs) && d.pcs.length)) return;
    applyLive(d);
    /* 주문·회원도 이어서 받아옵니다 */
    try{
      const r2=await fetch('/api/admin?do=orders',{credentials:'same-origin',cache:'no-store'});
      if(r2.ok){ applyOrders(await r2.json()); route(); }
    }catch(e){}
  }catch(e){}                               // 서버 함수가 없는 환경 → 목업 유지
}
syncLive();
setInterval(syncLive, 30000);               // 30초마다 새로 받아옵니다

/* 하트비트 표시 — 값만 갱신, 화면 재렌더 없음 */
let tickN=0;
setInterval(()=>{
  const el=$('tick'); if(!el)return;
  if(LIVE){ const s=Math.round((Date.now()-LIVE_AT)/1000); el.textContent=s<5?'방금':s+'초 전'; }
  else { tickN=(tickN+5)%30; el.textContent=tickN===0?'방금':tickN+'초 전'; }
},5000);

route();
</script>
